<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络连接工具 - 数据中心管理系统</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Cytoscape.js stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.21.2/cytoscape.min.css" rel="stylesheet" />
    
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f8fafc;
            --dark-text: #1e293b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--dark-text);
            line-height: 1.6;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            box-shadow: var(--shadow-lg);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            background: white;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 12px 12px 0 0 !important;
            border-bottom: 2px solid var(--border-color);
            padding: 1.25rem;
        }

        .card-title {
            margin: 0;
            font-weight: 600;
            color: var(--dark-text);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 0.625rem 1.25rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success-color);
            border-color: var(--success-color);
            border-radius: 8px;
        }

        .btn-danger {
            background: var(--danger-color);
            border-color: var(--danger-color);
            border-radius: 8px;
        }

        .btn-warning {
            background: var(--warning-color);
            border-color: var(--warning-color);
            border-radius: 8px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid var(--border-color);
            padding: 0.625rem 0.875rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.1);
        }

        .form-select {
            border-radius: 8px;
            border: 2px solid var(--border-color);
            padding: 0.625rem 0.875rem;
        }

        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.1);
        }

        .form-label {
            font-weight: 500;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
        }

        #topology-container {
            width: 100%;
            min-height: 500px;
            max-height: none;
            height: auto;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            position: relative;
            overflow: auto;
        }

        .device-types-container {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .interface-group {
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .interface-group h4 {
            color: var(--primary-color);
            margin-bottom: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .device-type-item {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem;
            margin-bottom: 0.75rem;
            cursor: grab;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-type-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .device-type-item:active {
            cursor: grabbing;
        }

        .device-type-info {
            flex: 1;
        }

        .device-type-name {
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
        }

        .device-type-summary {
            color: var(--secondary-color);
            font-size: 0.8rem;
        }

        .delete-device-type-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .delete-device-type-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            border-bottom: none;
        }

        .modal-title {
            font-weight: 600;
        }

        .close {
            color: white;
            opacity: 0.8;
        }

        .close:hover {
            opacity: 1;
        }

        #delete-element-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 500;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        #delete-element-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .btn-group .btn {
            margin-right: 0.5rem;
        }

        .btn-group .btn:last-child {
            margin-right: 0;
        }

        .statistics-card {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .statistics-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .statistics-label {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .section-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            margin: 1.5rem 0;
        }

        .drag-hint {
            background: var(--warning-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 10;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        @media (max-width: 768px) {
            .container-fluid {
                padding: 0.5rem;
            }
            
            .card {
                margin-bottom: 1rem;
            }
            
            #topology-container {
                min-height: 400px;
            }
            
            .interface-group {
                padding: 0.75rem;
            }

            .device-types-container {
                max-height: 300px;
            }
        }

        @media (max-width: 576px) {
            #topology-container {
                min-height: 350px;
            }
            
            .row .col-md-6 {
                margin-bottom: 0.75rem;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 拓扑图容器样式 */
        .topology-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--box-shadow);
            min-height: 500px; /* 最小高度 */
            height: auto; /* 自动高度 */
            max-height: none; /* 移除最大高度限制 */
            overflow: visible; /* 允许内容溢出 */
        }

        .topology-container h3 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #cy {
            width: 100%;
            min-height: 450px; /* 最小高度 */
            height: auto; /* 自动高度 */
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.1);
            overflow: visible; /* 允许内容溢出 */
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-network-wired me-2"></i>
                数据中心管理系统
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/device_management">
                        <i class="fas fa-desktop me-1"></i>
                        设备管理
                    </a>
                    <a class="nav-link" href="/rack_management">
                        <i class="fas fa-server me-1"></i>
                        机房机柜管理
                    </a>
                    <a class="nav-link" href="/all_rack_panels">
                        <i class="fas fa-th-large me-1"></i>
                        机柜面板
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-5 fw-bold text-center mb-0">
                    <i class="fas fa-project-diagram text-primary me-3"></i>
                    网络连接工具
                </h1>
                <p class="text-center text-muted mt-2">管理设备型号、创建设备实例并建立网络连接</p>
            </div>
        </div>

        <!-- 上半部分：设备管理区域 -->
        <div class="row mb-5">
            <!-- 设备定义区域 -->
            <div class="col-lg-8 col-md-12 mb-4">
                <div class="card fade-in">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-plus-circle text-primary"></i>
                            定义设备型号
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-model-name" class="form-label">设备型号名称</label>
                                <input type="text" id="device-model-name" class="form-control" placeholder="请输入设备型号名称">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="device-height-u" class="form-label">设备高度 (U)</label>
                                <input type="number" id="device-height-u" class="form-control" value="1" min="1" placeholder="1">
                            </div>
                        </div>
                        
                        <h5 class="mb-3">
                            <i class="fas fa-ethernet text-success me-2"></i>
                            接口定义
                        </h5>
                        
                        <div id="interfaces-container" class="mb-3">
                            <!-- Interface input groups will be added here by JavaScript -->
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <button type="button" id="add-interface-btn" class="btn btn-outline-primary w-100">
                                    <i class="fas fa-plus me-2"></i>
                                    添加接口类型
                                </button>
                            </div>
                            <div class="col-md-6 mb-3">
                                <button id="add-device-type-btn" class="btn btn-primary w-100">
                                    <i class="fas fa-save me-2"></i>
                                    添加设备类型
                                </button>
                            </div>
                        </div>

                        <div class="section-divider"></div>

                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <button id="addDeviceInstanceBtn" class="btn btn-success w-100">
                                    <i class="fas fa-plus me-2"></i>
                                    添加设备实例
                                </button>
                            </div>
                            <div class="col-md-4 mb-2">
                                <button id="batchAddDevicesBtn" class="btn btn-info w-100" data-bs-toggle="modal" data-bs-target="#batchAddModal">
                                    <i class="fas fa-layer-group me-2"></i>
                                    批量添加设备
                                </button>
                            </div>
                            <div class="col-md-4 mb-2">
                                <button id="exportConnectionsBtn" class="btn btn-warning w-100">
                                    <i class="fas fa-download me-2"></i>
                                    导出链路
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 已定义设备型号列表 -->
            <div class="col-lg-4 col-md-12 mb-4">
                <div class="card fade-in">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-list text-info"></i>
                            已定义设备型号
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="drag-hint">
                            <i class="fas fa-hand-paper"></i>
                            拖拽设备型号到拓扑图中创建实例
                        </div>
                        <div id="defined-device-types-list" class="device-types-container">
                            <!-- Device types will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下半部分：网络拓扑区域 -->
        <div class="row">
            <div class="col-12">
                <div class="card fade-in">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-sitemap text-success"></i>
                            网络拓扑图
                        </h3>
                    </div>
                    <div class="card-body p-0">
                        <div id="topology-container">
                            <div class="loading-overlay" id="topology-loading" style="display: none;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Connection Modal -->
    <div class="modal fade" id="connection-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-link me-2"></i>
                        选择连接接口
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6 class="text-primary">
                                <i class="fas fa-arrow-right me-2"></i>
                                源设备
                            </h6>
                            <p class="fw-bold" id="source-device-name"></p>
                            <label for="source-interface-select" class="form-label">源接口</label>
                            <select id="source-interface-select" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-success">
                                <i class="fas fa-arrow-left me-2"></i>
                                目标设备
                            </h6>
                            <p class="fw-bold" id="target-device-name"></p>
                            <label for="target-interface-select" class="form-label">目标接口</label>
                            <select id="target-interface-select" class="form-select"></select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>
                        取消
                    </button>
                    <button id="confirm-connection-btn" class="btn btn-primary">
                        <i class="fas fa-check me-2"></i>
                        确定连接
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Button (hidden by default) -->
    <button id="delete-element-btn" style="display: none; position: absolute; z-index: 10;">
        <i class="fas fa-trash me-1"></i>
        删除
    </button>

    <!-- 批量添加设备模态框 -->
    <div class="modal fade" id="batchAddModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-layer-group me-2"></i>
                        批量添加设备
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="batchDeviceType" class="form-label">
                            <i class="fas fa-microchip me-1"></i>
                            设备型号
                        </label>
                        <select id="batchDeviceType" class="form-select" required>
                            <option value="">请选择设备型号...</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="batchDevicePrefix" class="form-label">
                            <i class="fas fa-tag me-1"></i>
                            设备名称前缀
                        </label>
                        <input type="text" id="batchDevicePrefix" class="form-control" 
                               placeholder="例如: SW-" required>
                        <small class="form-text text-muted">设备名称将以此前缀开头</small>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="batchStartNumber" class="form-label">
                                <i class="fas fa-play me-1"></i>
                                起始编号
                            </label>
                            <input type="number" id="batchStartNumber" class="form-control" 
                                   min="1" value="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="batchEndNumber" class="form-label">
                                <i class="fas fa-stop me-1"></i>
                                结束编号
                            </label>
                            <input type="number" id="batchEndNumber" class="form-control" 
                                   min="1" value="10" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-map me-1"></i>
                            拓扑布局选项
                        </label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="batchLayout" 
                                   id="batchLayoutGrid" value="grid" checked>
                            <label class="form-check-label" for="batchLayoutGrid">
                                网格布局 (自动排列)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="batchLayout" 
                                   id="batchLayoutLine" value="line">
                            <label class="form-check-label" for="batchLayoutLine">
                                线性布局 (水平排列)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="batchLayout" 
                                   id="batchLayoutVertical" value="vertical">
                            <label class="form-check-label" for="batchLayoutVertical">
                                垂直布局 (垂直排列)
                            </label>
                        </div>
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <span id="batchPreviewText">预览：将创建 0 个设备</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>
                        取消
                    </button>
                    <button type="button" id="confirmBatchAdd" class="btn btn-success">
                        <i class="fas fa-plus me-1"></i>
                        批量创建
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <i class="fas fa-check me-2"></i>
                <span id="toastMessage"></span>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cytoscape.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.21.2/cytoscape.min.js"></script>

    <script>
        // Function to fetch and display device types
        function displayDeviceTypes() {
            fetch('/get_device_types')
                .then(response => response.json())
                .then(data => {
                    const deviceTypesList = document.getElementById('defined-device-types-list');
                    deviceTypesList.innerHTML = ''; // Clear current list
                    
                    if (data.device_types && data.device_types.length > 0) {
                        data.device_types.forEach(device => {
                            const deviceItem = document.createElement('div');
                            deviceItem.className = 'device-type-item';
                            
                            // Display device name and a summary of its interfaces
                            let interfaceSummary = device.interfaces_definition.map(ifaceGroup => {
                                 const quantity = ifaceGroup.end_num - ifaceGroup.start_num + 1;
                                 return `${ifaceGroup.type} x ${quantity}`;
                            }).join(', ');
                            
                            deviceItem.innerHTML = `
                                <div class="device-type-info">
                                    <div class="device-type-name">${device.name}</div>
                                    <div class="device-type-summary">${interfaceSummary}</div>
                                </div>

                            // Store the full device object in a data attribute for drag and drop
                            deviceItem.dataset.deviceTypeData = JSON.stringify(device);

                            deviceItem.draggable = true;

                            deviceItem.addEventListener('dragstart', function(event) {

        // Function to show loading animation
        function showLoading() {

        // Function to hide loading animation
        function hideLoading() {
            document.getElementById('topology-loading').style.display = 'none';
        }

        // Function to show toast notifications
        function showToast(message, type = 'success') {
            // Create toast element dynamically since we don't have it in the template
            const toastContainer = document.createElement('div');
            toastContainer.className = 'position-fixed top-0 end-0 p-3';
            toastContainer.style.zIndex = '11';
            
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            document.body.appendChild(toastContainer);
            
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            // Remove toast container after it's hidden
            toast.addEventListener('hidden.bs.toast', () => {
                document.body.removeChild(toastContainer);
            });
        }

        // Add event listener to the "添加接口类型" button
        document.getElementById('add-interface-btn').addEventListener('click', addInterfaceInput);

        // Call the function to display device types when the page loads
        document.addEventListener('DOMContentLoaded', function(){
            displayDeviceTypes();
            addInterfaceInput(); // Add initial interface group
            
            // Initialize Cytoscape.js
            showLoading();
            var cy = cytoscape({
                container: document.getElementById('topology-container'), // container to render in

                elements: [
                    // We will add nodes and edges here later
                ],

                style: [
                    // Define basic styles for nodes and edges
                    {

                        }
                    },
                    {

                        style: {

                        }
                    },
                    {

                            'width': 3,
                            'line-color': '#64748b',

                            'target-arrow-shape': 'triangle',
                            'label': 'data(label)',
                            'color': '#1e293b',
                            'text-rotation': 'autorotate',
                            'font-size': '10px',
                            'font-weight': 'bold',
                            'text-background-color': '#fff',
                            'text-background-opacity': 0.8,
                            'text-background-padding': '2px',
                            'curve-style': 'bezier',
                            'control-point-distances': 40,
                            'control-point-weights': 0.5
                        }
                    },
                    {
                        selector: 'edge:selected',
                        style: {
                            'line-color': '#fbbf24',
                            'target-arrow-color': '#fbbf24'
                        }
                    }
                ],

                layout: {
                    name: 'grid'
                }
            });

            hideLoading();
            console.log('Cytoscape.js initialized:', cy);

            // We can access the Cytoscape.js instance using the variable `cy`
            console.log('Cytoscape.js initialized:', cy);

            // Get the delete button element
            const deleteElementBtn = document.getElementById('delete-element-btn');

            // Function to position and show the delete button
            function showDeleteButton(element) {
                const bbox = element.renderedBoundingBox();
                
                // Position the button near the top-right corner of the element's bounding box
                // Adjust offset as needed for better visual placement
                deleteElementBtn.style.display = 'block';
                deleteElementBtn.style.left = `${bbox.x2 + 5}px`; // 5px to the right of the right edge
                deleteElementBtn.style.top = `${bbox.y1 - 5}px`; // 5px above the top edge

                // Store the element ID on the button for easy access
                deleteElementBtn.dataset.targetId = element.id();
                // Store element type (node or edge)
                 deleteElementBtn.dataset.elementType = element.group();
            }

            // Function to hide the delete button
            function hideDeleteButton() {
                deleteElementBtn.style.display = 'none';
                deleteElementBtn.dataset.targetId = '';
                deleteElementBtn.dataset.elementType = '';
            }

            // Add event listener for selecting elements (nodes and edges)
            cy.on('select', 'node, edge', function(event){
                const element = event.target; // The selected element
                showDeleteButton(element);
            });

            // Add event listener for unselecting elements
            cy.on('unselect', 'node, edge', function(){
                // Hide the button when an element is unselected
                hideDeleteButton();
            });

            // Add event listener for the delete button click
            deleteElementBtn.addEventListener('click', function() {
                const targetId = deleteElementBtn.dataset.targetId;
                const elementType = deleteElementBtn.dataset.elementType;

                if (!targetId || !elementType) {
                    console.error('Delete button clicked without a target element ID or type.');
                    return;
                }

                const elementToDelete = cy.getElementById(targetId);
                if (!elementToDelete) {
                    console.error(`Element with ID ${targetId} not found in Cytoscape.js.`);
                    return;
                }

                console.log(`Attempting to delete ${elementType}:`, targetId);

                if (elementType === 'nodes') {
                    console.log('Entering node delete logic.');
                    // Delete Node
                    const deleteUrl = `/delete_device_instance/${targetId}`;
                    console.log(`Sending DELETE request to: ${deleteUrl}`);
                    fetch(deleteUrl, {
                        method: 'DELETE'
                    })
                    .then(response => {
                        // Check if the response is OK before parsing JSON
                        if (!response.ok) {
                            // If backend returns a non-OK status, read the error message if available
                            return response.json().then(err => {
                                console.error('Error deleting node from backend:', err.message || response.statusText);
                                showToast(`删除设备失败: ${err.message || response.statusText}`, 'error');
                                throw new Error(err.message || response.statusText);
                            });
                        }
                        // If response is OK, parse the JSON data
                        return response.json();
                    })
                    .then(data => {
                        // This block is only executed if response was OK
                        console.log('Node deleted successfully from backend.', data);
                        elementToDelete.remove(); // Remove node and its connected edges from Cytoscape.js
                        hideDeleteButton(); // Hide the button
                        showToast('设备删除成功', 'success');

                        // Update interface lists on related nodes if needed (ports freed)
                         if (data && data.updated_instances) {
                            data.updated_instances.forEach(updatedInstance => {
                                const nodeToUpdate = cy.getElementById(updatedInstance.id);
                                if (nodeToUpdate) {
                                    nodeToUpdate.data(updatedInstance); // Update the entire data object
                                    console.log(`Node data updated for ${nodeToUpdate.id()} after deleting connected node.`);
                                }
                            });
                         }

                    })
                    .catch(error => {
                        console.error('Error sending delete request or backend error:', error);
                    });
                } else if (elementType === 'edges') {
                    console.log('Entering edge delete logic.');
                    // Delete Edge
                     const edgeData = elementToDelete.data();
                     const sourcePort = edgeData.label.split(' - ')[0].trim();
                     const targetPort = edgeData.label.split(' - ')[1].trim();

                     const deletePayload = {
                         source: edgeData.source,
                         target: edgeData.target,
                         source_port: sourcePort,
                         target_port: targetPort
                     };

                    console.log(`Sending POST request to /delete_connection with payload:`, deletePayload);

                    fetch('/delete_connection', { 
                        method: 'POST',
                         headers: {
                             'Content-Type': 'application/json'
                         },
                         body: JSON.stringify(deletePayload)
                    })
                    .then(response => {
                        // Check if the response is OK before parsing JSON
                        if (!response.ok) {
                            // If backend returns a non-OK status, read the error message if available
                            return response.json().then(err => {
                                console.error('Error deleting edge from backend:', err.message || response.statusText);
                                showToast(`删除连接失败: ${err.message || response.statusText}`, 'error');
                                throw new Error(err.message || response.statusText);
                            });
                        }
                        // If response is OK, parse the JSON data
                        return response.json();
                    })
                    .then(data => {
                        // This block is only executed if response was OK
                        console.log('Edge deleted successfully from backend.', data);
                        elementToDelete.remove(); // Remove edge from Cytoscape.js
                        hideDeleteButton(); // Hide the button
                        showToast('连接删除成功', 'success');
                         // Update interface lists on related nodes to reflect port release
                         if (data && data.updated_instances) {
                            data.updated_instances.forEach(updatedInstance => {
                                const nodeToUpdate = cy.getElementById(updatedInstance.id);
                                if (nodeToUpdate) {
                                    nodeToUpdate.data(updatedInstance); // Update the entire data object
                                    console.log(`Node data updated for ${nodeToUpdate.id()}:`, nodeToUpdate.data());
                                }
                            });
                         }

                    })
                    .catch(error => {
                        console.error('Error sending delete request or backend error:', error);
                    });
                }
            });

            // Add event listener to unselect elements when tapping on the background
            cy.on('tap', function(event){
                if(event.target === cy){
                    // If tap on background, unselect all elements
                    cy.$(':selected').unselect();
                }
            });

            // Function to load existing topology from the backend
            function loadTopology() {
                showLoading();
                // Fetch device instances
                fetch('/get_device_instances')
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.device_instances) {
                            // Add existing device instances as nodes
                            data.device_instances.forEach(instance => {
                                cy.add({
                                    group: 'nodes',
                                    data: instance, // Add all instance data, including interfaces
                                    position: instance.position // Use the stored position
                                });
                            });
                            console.log('Loaded device instances:', data.device_instances);
                        }

                        // After loading nodes, fetch and load connections
                        fetch('/get_connections')
                            .then(response => response.json())
                            .then(data => {
                                if (data && data.connections) {
                                    // Add existing connections as edges
                                    data.connections.forEach(connection => {
                                        // Check if source and target nodes exist before adding edge
                                        if (cy.getElementById(connection.source).length > 0 && cy.getElementById(connection.target).length > 0) {
                                             cy.add({
                                                 group: 'edges',
                                                 data: {
                                                     id: `edge_${connection.source}_${connection.target}_${connection.source_port}_${connection.target_port}`, // Recreate ID format
                                                     source: connection.source,
                                                     target: connection.target,
                                                     label: `${connection.source_port} - ${connection.target_port}` // Recreate label
                                                 }
                                             });
                                        }
                                    });
                                    console.log('Loaded connections:', data.connections);
                                }
                                // After loading, re-apply styles to ensure selected style works
                                cy.style().update();
                                
                                // Adjust container height after loading all nodes
                                adjustTopologyContainerHeight();
                                hideLoading();
                            })
                            .catch(error => {
                                console.error('Error fetching connections:', error);
                                hideLoading();
                                showToast('加载连接失败', 'error');
                            });
                    })
                    .catch(error => {
                        console.error('Error fetching device instances:', error);
                        hideLoading();
                        showToast('加载设备实例失败', 'error');
                    });
            }

            // Function to adjust topology container height based on node positions
            function adjustTopologyContainerHeight() {
                if (cy.nodes().length === 0) {
                    // If no nodes, keep minimum height
                    document.getElementById('topology-container').style.height = 'auto';
                    return;
                }

                // Get the bounding box of all nodes
                const boundingBox = cy.nodes().boundingBox();
                const padding = 100; // Add padding around nodes
                const minHeight = 500; // Minimum height

                // Calculate required height based on the lowest node position plus padding
                const requiredHeight = Math.max(minHeight, boundingBox.y2 + padding);
                
                // Set the container height
                const container = document.getElementById('topology-container');
                container.style.height = `${requiredHeight}px`;
                
                console.log(`Adjusted topology container height to: ${requiredHeight}px`);
            }

            // Call loadTopology when the page is ready
            loadTopology();

            // Variable to store the first selected node for connection
            let firstSelectedNode = null;
            // Variables to store the source and target nodes for the current connection attempt
            let sourceNodeForConnection = null;
            let targetNodeForConnection = null;

            // Get modal elements
            const connectionModal = new bootstrap.Modal(document.getElementById('connection-modal'));
            const sourceDeviceNameSpan = document.getElementById('source-device-name');
            const targetDeviceNameSpan = document.getElementById('target-device-name');
            const sourceInterfaceSelect = document.getElementById('source-interface-select');
            const targetInterfaceSelect = document.getElementById('target-interface-select');
            const confirmConnectionBtn = document.getElementById('confirm-connection-btn');

            // Function to open the modal
            function openConnectionModal(sourceNode, targetNode) {
                sourceNodeForConnection = sourceNode;
                targetNodeForConnection = targetNode;

                // Populate device names in the modal
                sourceDeviceNameSpan.textContent = sourceNode.data('instanceName');
                targetDeviceNameSpan.textContent = targetNode.data('instanceName');

                // TODO: Populate interface select options based on device types
                populateInterfaceSelect(sourceInterfaceSelect, sourceNode.data('interfaces')); // Assume interfaces are stored in node data
                populateInterfaceSelect(targetInterfaceSelect, targetNode.data('interfaces')); // Assume interfaces are stored in node data

                connectionModal.show();
            }
            
            // Function to close the modal and reset selected nodes
            function closeConnectionModal() {
                connectionModal.hide();
                // Clear the selection
                if (firstSelectedNode) {
                    firstSelectedNode.removeClass('selected');
                }
                firstSelectedNode = null;
                sourceNodeForConnection = null;
                targetNodeForConnection = null;
                // Clear select options (optional)
                sourceInterfaceSelect.innerHTML = '';
                targetInterfaceSelect.innerHTML = '';
            }

            // Function to populate select options with interfaces
            function populateInterfaceSelect(selectElement, interfaces) {
                selectElement.innerHTML = ''; // Clear existing options
                if (interfaces && interfaces.length > 0) {
                    interfaces.forEach(iface => {
                        const option = document.createElement('option');
                        option.value = iface.name; // Use interface name as value
                        option.textContent = `${iface.name} (${iface.type})`; // Display name and type
                        
                        // Disable the option if the interface status is not 'available'
                        if (iface.status !== 'available') {
                             option.disabled = true;
                             option.textContent += ' (已连接)'; // Add status to display text
                        }

                        selectElement.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = '无可用接口';
                    option.disabled = true;
                    selectElement.appendChild(option);
                }
            }

            // Add event listener for tapping (clicking) on nodes
            cy.on('tap', 'node', function(){
                const node = this; // The node that was tapped

                // Handle node selection for connection modal
                if (firstSelectedNode) {
                    // If a first node is already selected, try to connect to the second node
                    if (firstSelectedNode.id() !== node.id()) { // Prevent connecting a node to itself

                        // *** Open the connection modal instead of prompting ***
                        openConnectionModal(firstSelectedNode, node);

                        // The rest of the connection logic will be handled by the modal's confirm button

                    } else {
                        // If the same node is clicked again, deselect it
                        firstSelectedNode.removeClass('selected');
                        firstSelectedNode = null;
                    }
                } else {
                    // If no node is selected, select this one
                    firstSelectedNode = node;
                    firstSelectedNode.addClass('selected');
                    console.log(`First node selected: ${node.id()}`);
                }
            });

            // Add event listener for when a node is dragged and released
            cy.on('dragfree', 'node', function(event){
                const node = event.target; // The node that was dragged
                const newPosition = node.position(); // Get the new position
                const nodeId = node.id(); // Get the node ID

                console.log(`Node ${nodeId} dragged to position:`, newPosition);

                // Send the updated position to the backend
                fetch(`/update_device_instance_position/${nodeId}`, {
                    method: 'PUT', // Use PUT for updating resources
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ position: newPosition })
                })
                .then(response => {
                    if (!response.ok) {
                         // If backend returns a non-OK status, read the error message
                        return response.json().then(err => {
                            console.error(`Error updating position for node ${nodeId} on backend:`, err.message || response.statusText);
                            showToast(`更新设备位置失败: ${err.message || response.statusText}`, 'error');
                            throw new Error(err.message || response.statusText);
                        });
                    }
                    return response.json(); // Backend might return confirmation or updated data
                })
                .then(data => {
                    console.log(`Position updated successfully for node ${nodeId} on backend:`, data);
                    // Adjust container height after node position change
                    adjustTopologyContainerHeight();
                })
                .catch(error => {
                    console.error(`Error sending position update request for node ${nodeId}:`, error);
                });
            });

            // Event listener for the confirm connection button in the modal
            confirmConnectionBtn.addEventListener('click', function() {
                const sourceNode = sourceNodeForConnection;
                const targetNode = targetNodeForConnection;
                const sourcePort = sourceInterfaceSelect.value; // Get selected source port
                const targetPort = targetInterfaceSelect.value; // Get selected target port

                if (sourceNode && targetNode && sourcePort && targetPort) {
                    // Add an edge between the two nodes in Cytoscape.js
                    cy.add({
                        group: 'edges',
                        data: {
                            id: `edge_${sourceNode.id()}_${targetNode.id()}_${sourcePort}_${targetPort}`,
                            source: sourceNode.id(),
                            target: targetNode.id(),
                            label: `${sourcePort} - ${targetPort}` // Optional: display ports on the edge
                        }
                    });

                    console.log(`Connecting ${sourceNode.data('label')}:${sourcePort} to ${targetNode.data('label')}:${targetPort}`);

                    // Send connection data with ports to the backend
                    fetch('/add_connection', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            source: sourceNode.id(),
                            target: targetNode.id(),
                            source_port: sourcePort,
                            target_port: targetPort
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Connection added to backend:', data);
                        showToast('连接创建成功', 'success');
                        // Update node data in Cytoscape.js with the updated interfaces status
                        if (data && data.updated_instances) {
                            data.updated_instances.forEach(updatedInstance => {
                                const nodeToUpdate = cy.getElementById(updatedInstance.id);
                                if (nodeToUpdate) {
                                    nodeToUpdate.data(updatedInstance); // Update the entire data object
                                    console.log(`Node data updated for ${nodeToUpdate.id()}:`, nodeToUpdate.data());
                                }
                            });
                        }
                        closeConnectionModal();
                    })
                    .catch((error) => {
                        console.error('Error adding connection to backend:', error);
                        showToast('创建连接失败', 'error');
                        closeConnectionModal();
                    });

                } else {
                    console.log('Connection not confirmed: Missing nodes or selected ports.');
                    showToast('请选择有效的接口', 'error');
                    closeConnectionModal();
                }
            });

            // Handle drag and drop to add nodes
            const topologyContainer = document.getElementById('topology-container');

            topologyContainer.addEventListener('dragover', function(event) {
                event.preventDefault(); // Prevent default to allow drop
            });

            topologyContainer.addEventListener('drop', function(event) {
                event.preventDefault();
                const deviceData = JSON.parse(event.dataTransfer.getData('text/plain'));

                // Prompt user for a device instance name
                const instanceName = prompt(`请为 ${deviceData.name} 设备输入实例名称:`);

                // Only add node if a name was provided
                if (instanceName) {
                    const containerRect = topologyContainer.getBoundingClientRect();
                    const canvasX = event.clientX - containerRect.left;
                    const canvasY = event.clientY - containerRect.top;

                    const pan = cy.pan();
                    const zoom = cy.zoom();
                    const modelX = (canvasX - pan.x) / zoom;
                    const modelY = (canvasY - pan.y) / zoom;

                    // Add the device as a node to Cytoscape.js
                    const newNode = cy.add({
                        group: 'nodes',
                        data: { 
                            id: `device_${Date.now()}`, // Unique ID for the node in Cytoscape
                            instanceName: instanceName, // Store the user-provided instance name
                            deviceType: deviceData.name, // Store the device type name
                            portType: deviceData.port_type,
                            portQuantity: deviceData.port_quantity,
                            label: instanceName // Display the instance name as the node label
                        },
                        position: { x: modelX, y: modelY }
                    });

                    // Prepare data to send to backend, including position
                    const instanceDataToSend = {
                        ...newNode.data(), // Include all data properties
                        position: newNode.position() // Include the position
                    };

                    // Send the device instance data to the backend for storage
                    fetch('/add_device_instance', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(instanceDataToSend)
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(err.message || '创建设备实例失败');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Device instance added to backend:', data);
                        showToast(`设备实例 "${instanceName}" 创建成功`, 'success');
                        // Update the node data in Cytoscape.js with the full instance data from the backend
                        if (data && data.instance) {
                            newNode.data(data.instance); // Update node data with interfaces, etc.
                            console.log('Node data updated:', newNode.data());
                        }
                        // Adjust container height after adding new node
                        adjustTopologyContainerHeight();
                    })
                    .catch((error) => {
                        console.error('Error adding device instance to backend:', error);
                        showToast(error.message || '创建设备实例失败', 'error');
                        // Remove the node from the graph since the backend operation failed
                        cy.remove(newNode);
                    });

                } else {
                    console.log('Device instance not added because no name was provided.');
                }
            });

            // Add event listener for the Export Connections button
            document.getElementById('exportConnectionsBtn').addEventListener('click', function() {
                console.log('Export Connections button clicked.');

                // Send a GET request to the backend export route
                fetch('/export_connections')
                .then(response => {
                    if (!response.ok) {
                        // If backend returns a non-OK status, handle the error
                         // Attempt to read JSON error message if available
                        response.json().then(err => {
                             console.error('Error exporting connections:', err.message || response.statusText);
                             showToast(`导出链路失败: ${err.message || response.statusText}`, 'error');
                         }).catch(jsonError => {
                              // Handle case where response is not JSON (e.g., pure text error)
                              response.text().then(textErr => {
                                console.error('Error exporting connections:', response.statusText, textErr);
                                showToast(`导出链路失败: ${response.statusText}`, 'error');
                              }).catch(txtErr => {
                                console.error('Error exporting connections:', response.statusText);
                                showToast(`导出链路失败: ${response.statusText}`, 'error');
                              });
                         });
                         // Throw an error to stop the promise chain
                         throw new Error('Export failed');
                    }
                    
                    // If response is OK, initiate file download
                    // Get filename from Content-Disposition header if available
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = 'connections.xlsx'; // Default filename (Excel)
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                        if (filenameMatch && filenameMatch[1]) {
                            // Decode filename if necessary (e.g., if it contains non-ASCII characters and is encoded)
                            // Simple example: URL decoding (more complex cases might need specific encoding handling)
                             try {
                                 filename = decodeURIComponent(filenameMatch[1]);
                             } catch (e) {
                                 filename = filenameMatch[1]; // Use raw filename if decoding fails
                                 console.warn('Could not decode filename, using raw filename.', e);
                             }
                        }
                    }

                    // Return the response as a Blob to create a download link
                    return response.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    // Create a download link and trigger click
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename; // Use the obtained filename
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url); // Clean up the URL object
                    console.log('Connections exported successfully.');
                    showToast('链路导出成功', 'success');
                })
                .catch(error => {
                    // This catch block handles network errors or errors thrown in the .then block
                    console.error('Error sending export request or processing response:', error);
                });
            });

            // Add event listener for deleting device types using event delegation
            document.getElementById('defined-device-types-list').addEventListener('click', function(event) {
                // Check if the clicked element is a delete button
                if (event.target.closest('.delete-device-type-btn')) {
                    const button = event.target.closest('.delete-device-type-btn');
                    const deviceTypeName = button.dataset.deviceTypeName;

                    if (confirm(`确定要删除设备型号 "${deviceTypeName}"?`)) {
                        // Send DELETE request to the backend
                        fetch(`/delete_device_type/${deviceTypeName}`, {
                            method: 'DELETE'
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.message === 'Device type deleted successfully') {
                                showToast('设备型号删除成功', 'success');
                                displayDeviceTypes(); // Refresh the list
                            } else {
                                showToast(data.message, 'error');
                            }
                        })
                        .catch(error => {
                            console.error('Error deleting device type:', error);
                            showToast('删除设备型号失败', 'error');
                        });
                    }
                }
            });

            // 批量添加设备功能
            const batchAddModal = new bootstrap.Modal(document.getElementById('batchAddModal'));
            const batchDeviceTypeSelect = document.getElementById('batchDeviceType');
            const batchDevicePrefixInput = document.getElementById('batchDevicePrefix');
            const batchStartNumberInput = document.getElementById('batchStartNumber');
            const batchEndNumberInput = document.getElementById('batchEndNumber');
            const batchPreviewText = document.getElementById('batchPreviewText');

            // 填充设备型号下拉菜单
            function populateBatchDeviceTypes() {
                fetch('/get_device_types')
                    .then(response => response.json())
                    .then(data => {
                        batchDeviceTypeSelect.innerHTML = '<option value="">请选择设备型号...</option>';
                        if (data.device_types && data.device_types.length > 0) {
                            data.device_types.forEach(device => {
                                const option = document.createElement('option');
                                option.value = device.name;
                                option.textContent = device.name;
                                option.dataset.deviceData = JSON.stringify(device);
                                batchDeviceTypeSelect.appendChild(option);
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching device types:', error);
                        showToast('获取设备型号失败', 'error');
                    });
            }

            // 计算预览信息
            function updateBatchPreview() {
                const startNum = parseInt(batchStartNumberInput.value) || 0;
                const endNum = parseInt(batchEndNumberInput.value) || 0;
                const deviceCount = endNum >= startNum ? endNum - startNum + 1 : 0;
                
                if (deviceCount > 0) {
                    const prefix = batchDevicePrefixInput.value || '';
                    batchPreviewText.innerHTML = `
                        <i class="fas fa-info-circle me-2"></i>
                        预览：将创建 <strong>${deviceCount}</strong> 个设备
                        <br>
                        <small class="text-muted">设备名称示例: ${prefix}${String(startNum).padStart(2, '0')}, ${prefix}${String(Math.min(startNum + 1, endNum)).padStart(2, '0')}...</small>
                    `;
                } else {
                    batchPreviewText.innerHTML = `
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        预览：将创建 0 个设备
                    `;
                }
            }

            // 计算批量设备的位置
            function calculateBatchPositions(deviceCount, layoutType) {
                const positions = [];
                const spacing = 100; // 设备间距
                const startX = 100;
                const startY = 100;

                for (let i = 0; i < deviceCount; i++) {
                    let x, y;
                    
                    switch (layoutType) {
                        case 'line':
                            x = startX + (i * spacing);
                            y = startY;
                            break;
                        case 'vertical':
                            x = startX;
                            y = startY + (i * spacing);
                            break;
                        case 'grid':
                        default:
                            const cols = Math.ceil(Math.sqrt(deviceCount));
                            const row = Math.floor(i / cols);
                            const col = i % cols;
                            x = startX + (col * spacing);
                            y = startY + (row * spacing);
                            break;
                    }
                    
                    positions.push({ x, y });
                }
                
                return positions;
            }

            // 批量创建设备
            async function createBatchDevices() {
                const selectedDeviceType = batchDeviceTypeSelect.value;
                const devicePrefix = batchDevicePrefixInput.value.trim();
                const startNum = parseInt(batchStartNumberInput.value);
                const endNum = parseInt(batchEndNumberInput.value);
                const layoutType = document.querySelector('input[name="batchLayout"]:checked').value;

                // 验证输入
                if (!selectedDeviceType) {
                    showToast('请选择设备型号', 'error');
                    return;
                }
                if (!devicePrefix) {
                    showToast('请输入设备名称前缀', 'error');
                    return;
                }
                if (isNaN(startNum) || isNaN(endNum) || startNum > endNum) {
                    showToast('请输入有效的起始和结束编号', 'error');
                    return;
                }

                const deviceCount = endNum - startNum + 1;
                if (deviceCount > 50) {
                    if (!confirm('一次性创建超过50个设备可能会较慢，确定要继续吗？')) {
                        return;
                    }
                }

                // 获取设备型号数据
                const selectedOption = batchDeviceTypeSelect.options[batchDeviceTypeSelect.selectedIndex];
                const deviceData = JSON.parse(selectedOption.dataset.deviceData);

                // 计算设备位置
                const positions = calculateBatchPositions(deviceCount, layoutType);

                // 创建设备实例
                const createdDevices = [];
                const failedDevices = [];

                showLoading();
                batchAddModal.hide();

                for (let i = 0; i < deviceCount; i++) {
                    const deviceNumber = startNum + i;
                    const instanceName = `${devicePrefix}${String(deviceNumber).padStart(2, '0')}`;
                    const position = positions[i];

                    try {
                        // 先在拓扑中添加节点
                        const newNode = cy.add({
                            group: 'nodes',
                            data: { 
                                id: `device_${Date.now()}_${i}`,
                                instanceName: instanceName,
                                deviceType: deviceData.name,
                                portType: deviceData.port_type,
                                portQuantity: deviceData.port_quantity,
                                label: instanceName
                            },
                            position: position
                        });

                        // 准备发送到后端的数据
                        const instanceDataToSend = {
                            ...newNode.data(),
                            position: newNode.position()
                        };

                        // 发送到后端
                        const response = await fetch('/add_device_instance', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(instanceDataToSend)
                        });

                        const result = await response.json();
                        
                        if (result && result.instance) {
                            newNode.data(result.instance);
                            createdDevices.push(instanceName);
                        } else {
                            // 如果后端创建失败，从拓扑中移除节点
                            cy.remove(newNode);
                            failedDevices.push(instanceName);
                        }
                    } catch (error) {
                        console.error(`Error creating device ${instanceName}:`, error);
                        failedDevices.push(instanceName);
                    }

                    // 显示进度（每10个设备显示一次）
                    if ((i + 1) % 10 === 0 || i === deviceCount - 1) {
                        showToast(`已创建 ${i + 1}/${deviceCount} 个设备...`, 'success');
                    }
                }

                hideLoading();

                // 调整拓扑容器高度
                adjustTopologyContainerHeight();

                // 显示完成消息
                const successCount = createdDevices.length;
                const failureCount = failedDevices.length;

                if (successCount > 0) {
                    showToast(`批量创建完成！成功创建 ${successCount} 个设备${failureCount > 0 ? `，失败 ${failureCount} 个` : ''}`, 'success');
                } else {
                    showToast('批量创建失败，未创建任何设备', 'error');
                }

                // 清空表单
                resetBatchForm();
            }

            // 重置批量添加表单
            function resetBatchForm() {
                batchDeviceTypeSelect.value = '';
                batchDevicePrefixInput.value = '';
                batchStartNumberInput.value = '1';
                batchEndNumberInput.value = '10';
                document.getElementById('batchLayoutGrid').checked = true;
                updateBatchPreview();
            }

            // 事件监听器
            batchStartNumberInput.addEventListener('input', updateBatchPreview);
            batchEndNumberInput.addEventListener('input', updateBatchPreview);
            batchDevicePrefixInput.addEventListener('input', updateBatchPreview);

            document.getElementById('confirmBatchAdd').addEventListener('click', createBatchDevices);

            // 当模态框显示时填充设备型号
            document.getElementById('batchAddModal').addEventListener('show.bs.modal', function() {
                populateBatchDeviceTypes();
                updateBatchPreview();
            });

        });

        // Add event listener to the "添加设备类型" button
        document.getElementById('add-device-type-btn').addEventListener('click', function() {
            const deviceModelName = document.getElementById('device-model-name').value;
            const deviceHeightU = parseInt(document.getElementById('device-height-u').value, 10); // Get and parse height
            const interfaceGroups = document.querySelectorAll('.interface-group');
            const interfacesData = [];

            interfaceGroups.forEach(group => {
                const type = group.querySelector('.interface-type').value;
                const prefix = group.querySelector('.interface-prefix').value;
                 const naming = group.querySelector('.interface-naming').value;
                const startNum = parseInt(group.querySelector('.interface-start-num').value, 10);
                const endNum = parseInt(group.querySelector('.interface-end-num').value, 10);

                if (type && prefix && naming && !isNaN(startNum) && !isNaN(endNum) && startNum <= endNum) {
                    interfacesData.push({
                        type: type,
                        prefix: prefix,
                        naming: naming,
                        start_num: startNum,
                        end_num: endNum
                    });
                }
            });

            if (!deviceModelName) {
                showToast('请输入设备型号名称', 'error');
                return;
            }
             if (isNaN(deviceHeightU) || deviceHeightU < 1) {
                showToast('请输入有效的设备高度 (U)', 'error');
                return;
            }
            if (interfacesData.length === 0) {
                showToast('请至少添加一个接口类型定义', 'error');
                return;
            }

            fetch('/add_device_type', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    deviceModelName: deviceModelName,
                    height_u: deviceHeightU, // Include height in the payload
                    interfaces: interfacesData,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Device type added successfully') {
                    showToast('设备型号添加成功', 'success');
                    // Clear the form
                    document.getElementById('device-model-name').value = '';
                     document.getElementById('device-height-u').value = '1'; // Reset height
                    const interfacesContainer = document.getElementById('interfaces-container');
                    interfacesContainer.innerHTML = ''; // Clear interface groups
                    addInterfaceInput(); // Add one initial interface group back
                    displayDeviceTypes(); // Refresh the list of defined types
                } else {
                    showToast(data.message, 'error');
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                showToast('添加设备型号失败', 'error');
            });
        });
    </script>
