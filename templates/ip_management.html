<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP管理 - 数据中心管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f8fafc;
            --dark-text: #1e293b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--dark-text);
            line-height: 1.6;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            box-shadow: var(--shadow-lg);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            background: white;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 0.625rem 1.25rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .table-responsive {
            box-shadow: var(--shadow);
            border-radius: 12px;
            background-color: white;
            margin-top: 1rem;
        }

        .table thead {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--dark-text);
        }

        .table thead th {
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
            font-weight: 600;
        }

        .form-select, .form-control {
            border-radius: 8px;
            border: 2px solid var(--border-color);
            padding: 0.625rem 0.875rem;
            transition: all 0.2s ease;
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.1);
        }

        .status-badge {
            padding: 0.35em 0.65em;
            font-size: .75em;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.25rem;
        }

        .status-used { background-color: var(--danger-color); }
        .status-available { background-color: var(--success-color); }

        .modal-content {
            border-radius: 12px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid var(--border-color);
        }

        .modal-footer {
            border-top: 2px solid var(--border-color);
        }

        .btn {
            border-radius: 8px;
            font-weight: 500;
        }

        .alert {
            border-radius: 8px;
            border: none;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-network-wired me-2"></i>IP管理
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/connection_tool">
                    <i class="fas fa-network-wired me-1"></i>连线工具
                </a>
                <a class="nav-link" href="/device_management">
                    <i class="fas fa-microchip me-1"></i>设备管理
                </a>
                <a class="nav-link" href="/rack_management">
                    <i class="fas fa-server me-1"></i>机柜管理
                </a>
                <a class="nav-link" href="/all_rack_panels">
                    <i class="fas fa-border-all me-1"></i>机柜面板
                </a>
                <a class="nav-link active" href="/ip_management">
                    <i class="fas fa-network-wired me-1"></i>IP管理
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-5 fw-bold text-center mb-0">
                    <i class="fas fa-network-wired text-primary me-3"></i>
                    IP地址管理
                </h1>
                <p class="text-center text-muted mt-2">管理和分配数据中心的IP地址资源</p>
            </div>
        </div>

        <!-- 工具栏和过滤器 -->
        <div class="card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-auto">
                    <button class="btn btn-primary" onclick="showAddIPPoolModal()">
                        <i class="fas fa-plus me-1"></i> 添加IP网段
                    </button>
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-success" onclick="showImportModal()">
                        <i class="fas fa-file-import me-1"></i> 导入
                    </button>
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-info text-white" onclick="exportIPData()">
                        <i class="fas fa-file-export me-1"></i> 导出
                    </button>
                </div>
                <div class="col"></div> <!-- 间隔 -->
                <div class="col-md-3">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="搜索IP地址...">
                        <button class="btn btn-outline-secondary" type="button" onclick="searchIP()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="statusFilter">
                        <option value="all">所有状态</option>
                        <option value="used">已使用</option>
                        <option value="available">可用</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- IP网段列表 -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>网段名称</th>
                        <th>网段地址</th>
                        <th>子网掩码</th>
                        <th>可分配空间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ipPoolList">
                    <!-- IP网段数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>

        <!-- 已分配子网列表 -->
        <div class="card p-3 mt-4">
            <div class="row g-3">
                <div class="col-12 d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">已分配子网</h5>
                    <button class="btn btn-primary" onclick="showAssignSubnetModal()">
                        <i class="fas fa-plus me-1"></i>分配新子网
                    </button>
                </div>
                <div class="col-12">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>子网地址</th>
                                    <th>子网掩码</th>
                                    <th>所属网段</th>
                                    <th>使用部门</th>
                                    <th>分配时间</th>
                                    <th>备注</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="assignedSubnetsList">
                                <!-- 已分配子网数据将通过JavaScript动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分配子网模态框 -->
        <div class="modal fade" id="assignSubnetModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">分配新子网</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="assignSubnetForm">
                            <div class="mb-3">
                                <label class="form-label">选择所属网段</label>
                                <select class="form-select" id="poolSelect" required>
                                    <option value="">请选择网段</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">子网地址</label>
                                <input type="text" class="form-control" id="subnetAddress" required 
                                       placeholder="例如: 192.168.100.0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">子网掩码</label>
                                <select class="form-select" id="subnetMask" required>
                                    <option value="">请选择子网掩码</option>
                                    <option value="/24">/24 (255.255.255.0)</option>
                                    <option value="/25">/25 (255.255.255.128)</option>
                                    <option value="/26">/26 (255.255.255.192)</option>
                                    <option value="/27">/27 (255.255.255.224)</option>
                                    <option value="/28">/28 (255.255.255.240)</option>
                                    <option value="/29">/29 (255.255.255.248)</option>
                                    <option value="/30">/30 (255.255.255.252)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">使用部门</label>
                                <input type="text" class="form-control" id="department" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="subnetDescription" rows="3"
                                          placeholder="请输入子网用途、项目信息等备注"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="confirmAssignSubnet()">确认分配</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加IP网段模态框 -->
        <div class="modal fade" id="addIPPoolModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">添加IP网段</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addIPPoolForm">
                            <div class="mb-3">
                                <label class="form-label">网段名称</label>
                                <input type="text" class="form-control" id="poolName" required
                                       placeholder="例如: 办公网网段">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">网段地址</label>
                                <input type="text" class="form-control" id="networkAddress" required
                                       placeholder="例如: 192.168.0.0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">子网掩码</label>
                                <select class="form-select" id="poolMask" required>
                                    <option value="/16">/16 (255.255.0.0)</option>
                                    <option value="/17">/17 (255.255.128.0)</option>
                                    <option value="/18">/18 (255.255.192.0)</option>
                                    <option value="/19">/19 (255.255.224.0)</option>
                                    <option value="/20">/20 (255.255.240.0)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="poolDescription" rows="3"
                                          placeholder="请输入网段用途等备注信息"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="addIPPool()">添加</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 导入IP数据模态框 -->
        <div class="modal fade" id="importModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">导入IP数据</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="importForm">
                            <div class="mb-3">
                                <label class="form-label">选择Excel文件</label>
                                <input type="file" class="form-control" id="importFile" accept=".xlsx,.xls">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="importData()">导入</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分配IP模态框 -->
        <div class="modal fade" id="assignIPModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">分配IP地址</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="assignIPForm">
                            <input type="hidden" id="assignIPId">
                            <div class="mb-3">
                                <label class="form-label">分配给</label>
                                <input type="text" class="form-control" id="assignedTo" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">备注</label>
                                <textarea class="form-control" id="assignDescription"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="confirmAssignIP()">确认分配</button>
                    </div>
                </div>
            </div>
        </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

    <script>
        // 初始化模态框
        const addIPPoolModal = new bootstrap.Modal(document.getElementById('addIPPoolModal'));
        const assignSubnetModal = new bootstrap.Modal(document.getElementById('assignSubnetModal'));

        // 页面加载完成后执行
        $(document).ready(function() {
            loadIPPools();
            loadAssignedSubnets();
            initializePoolSelect();
        });

        // 初始化网段选择器
        function initializePoolSelect() {
            $.get('/api/ip_pools', function(data) {
                let html = '<option value="">请选择网段</option>';
                data.forEach(pool => {
                    html += `<option value="${pool.id}">${pool.name} (${pool.network})</option>`;
                });
                $('#poolSelect').html(html);
            });
        }

        // 加载IP网段列表
        function loadIPPools() {
            $.get('/api/ip_pools', function(data) {
                let html = '';
                data.forEach(pool => {
                    const availableSpace = calculateAvailableSpace(pool.network, pool.subnet_mask);
                    html += `
                        <tr>
                            <td>${pool.name}</td>
                            <td>${pool.network}</td>
                            <td>${pool.subnet_mask}</td>
                            <td>${availableSpace}</td>
                            <td>
                                <button class="btn btn-sm btn-info text-white" onclick="viewPoolDetails('${pool.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deletePool('${pool.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                $('#ipPoolList').html(html);
            });
        }

        // 加载已分配子网列表
        function loadAssignedSubnets() {
            $.get('/api/assigned_subnets', function(data) {
                let html = '';
                data.forEach(subnet => {
                    html += `
                        <tr>
                            <td>${subnet.network}</td>
                            <td>${subnet.subnet_mask}</td>
                            <td>${subnet.pool_name}</td>
                            <td>${subnet.department}</td>
                            <td>${formatDateTime(subnet.assigned_time)}</td>
                            <td>${subnet.description || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="releaseSubnet('${subnet.id}')">
                                    <i class="fas fa-undo me-1"></i>释放
                                </button>
                            </td>
                        </tr>
                    `;
                });
                $('#assignedSubnetsList').html(html);
            });
        }

        // 显示添加IP网段模态框
        function showAddIPPoolModal() {
            addIPPoolModal.show();
        }

        // 显示分配子网模态框
        function showAssignSubnetModal() {
            assignSubnetModal.show();
        }

        // 添加IP网段
        function addIPPool() {
            const data = {
                name: $('#poolName').val(),
                network: $('#networkAddress').val(),
                subnet_mask: $('#poolMask').val(),
                description: $('#poolDescription').val()
            };

            $.ajax({
                url: '/api/ip_pools',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    addIPPoolModal.hide();
                    loadIPPools();
                    initializePoolSelect();
                    // 清空表单
                    $('#addIPPoolForm')[0].reset();
                },
                error: function(xhr) {
                    alert('添加IP网段失败：' + xhr.responseJSON.error);
                }
            });
        }

        // 确认分配子网
        function confirmAssignSubnet() {
            const data = {
                pool_id: $('#poolSelect').val(),
                network: $('#subnetAddress').val(),
                subnet_mask: $('#subnetMask').val(),
                department: $('#department').val(),
                description: $('#subnetDescription').val()
            };

            $.ajax({
                url: '/api/assign_subnet',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    assignSubnetModal.hide();
                    loadIPPools();
                    loadAssignedSubnets();
                    // 清空表单
                    $('#assignSubnetForm')[0].reset();
                },
                error: function(xhr) {
                    alert('分配子网失败：' + xhr.responseJSON.error);
                }
            });
        }

        // 释放子网
        function releaseSubnet(subnetId) {
            if(confirm('确定要释放这个子网吗？')) {
                $.ajax({
                    url: `/api/release_subnet/${subnetId}`,
                    type: 'POST',
                    success: function() {
                        loadIPPools();
                        loadAssignedSubnets();
                    },
                    error: function(xhr) {
                        alert('释放失败：' + xhr.responseJSON.error);
                    }
                });
            }
        }

        // 查看IP网段详情
        function viewPoolDetails(poolId) {
            // TODO: 实现查看详情功能
            alert('功能开发中...');
        }

        // 删除IP网段
        function deletePool(poolId) {
            if(confirm('确定要删除这个网段吗？删除前请确保没有已分配的子网。')) {
                $.ajax({
                    url: `/api/ip_pools/${poolId}`,
                    type: 'DELETE',
                    success: function() {
                        loadIPPools();
                        initializePoolSelect();
                    },
                    error: function(xhr) {
                        alert('删除失败：' + xhr.responseJSON.error);
                    }
                });
            }
        }

        // 计算可用空间
        function calculateAvailableSpace(network, mask) {
            // 简单显示网段范围
            return `${network}${mask}`;
        }

        // 格式化日期时间
        function formatDateTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
